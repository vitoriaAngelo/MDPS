name: Publicar versão

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Testar
        shell: pwsh
        run: dotnet test tests/MDPS.Tests/MDPS.Tests.csproj -c Release

      - name: Gerar ZIP portátil
        shell: pwsh
        run: ./package.ps1

      - name: Instalar gerador do instalador
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/MDPS.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: MDPS-Windows
          path: |
            release/MDPS-portatil-win-x64.zip
            release/MDPS-Setup-win-x64.exe

      - name: Criar versão para download
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag release/MDPS-portatil-win-x64.zip release/MDPS-Setup-win-x64.exe --clobber
          } else {
            gh release create $tag release/MDPS-portatil-win-x64.zip release/MDPS-Setup-win-x64.exe --title "MDPS $tag" --generate-notes
          }
